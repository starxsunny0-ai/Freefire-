<style>
:root{--b:#3d78f2;--bg:#050507;--card:#0d0e13;--line:#3a3f4d;--gold:#dbe3f2;--ok:#2ecc71;--red:#ff4757;--silver:linear-gradient(180deg,#fff,#a9b6d0)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,a,.ic,.chip,.mode,.tile,.card,nav a,.pick,.side a{touch-action:manipulation}
.btn:active,.chip:active,.mode:active,nav a:active,.ic:active,.card.m:active{transform:scale(.97);opacity:.85}
.boot{min-height:100vh;display:grid;place-items:center;text-align:center}.spin{width:34px;height:34px;border:3px solid #262a38;border-top-color:#9db8f5;border-radius:50%;animation:sp .8s linear infinite;margin:14px auto 0}@keyframes sp{to{transform:rotate(360deg)}}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#fff;background-color:var(--bg);min-height:100vh;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 80% 0,rgba(120,135,170,.22),transparent 50%),radial-gradient(circle at 0 100%,rgba(42,108,255,.10),transparent 45%);pointer-events:none;z-index:-1}
.img{background-size:cover;background-position:center;background-color:#1a1c24}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;position:sticky;top:0;z-index:20;background:rgba(6,6,9,.92);backdrop-filter:blur(8px)}
header b{flex:1;font-size:20px;font-style:italic;letter-spacing:2px;background:var(--silver);-webkit-background-clip:text;background-clip:text;color:transparent}
.ic{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;cursor:pointer;background:var(--card);flex-shrink:0}
.chip{border:1px solid var(--b);border-radius:10px;padding:7px 11px;font-weight:700;background:rgba(150,165,200,.12);cursor:pointer}
main{max-width:900px;margin:auto;padding:8px 14px}
h2{font-style:italic;font-size:17px;margin:18px 0 10px;letter-spacing:.5px;background:var(--silver);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;background:linear-gradient(160deg,#171921,#090a0e);box-shadow:inset 0 1px 0 rgba(220,230,255,.14);margin-bottom:10px}
.banner{height:170px;border-radius:14px;border:1px solid var(--b);position:relative;overflow:hidden;box-shadow:0 0 18px rgba(150,165,200,.28)}
.banner div{position:absolute;right:14px;top:26px;text-align:right}.banner h3{font-size:26px;font-style:italic}.banner p{color:var(--gold);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid4{grid-template-columns:repeat(4,1fr)}
.mode{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);cursor:pointer;text-align:center}
.mode .img{height:60px}.mode b{display:block;font-size:12px;padding:6px 4px 0}.mode small{font-size:10px;color:var(--b);display:block;padding-bottom:6px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-size:11px;background:var(--card);cursor:pointer}.tile em{display:block;font-style:normal;font-size:22px}
.m{display:flex;justify-content:space-between;gap:8px;cursor:pointer}.m h4{font-size:15px}.dim,.m small{color:#9aa3b5;font-size:12px;text-shadow:0 1px 5px rgba(0,0,0,.9)}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--ok);color:#000;margin-left:6px}.tag.live{background:var(--red);color:#fff}.tag.x{background:#445;color:#fff}
.bar{height:5px;background:#262a38;border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--b)}
.gold{color:var(--gold);font-weight:700}.big{font-size:32px;font-weight:800}
.btn{display:block;width:100%;background:linear-gradient(135deg,#10204f,#1f56c8 55%,#4b86f0);border:1px solid #dbe3f2;color:#fff;padding:12px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;margin-top:10px}
.btn.alt{background:var(--card);border-color:var(--line)}.btn.ok{background:var(--ok);color:#000;border-color:var(--ok)}.btn:disabled{opacity:.5}
input,select,textarea{width:100%;padding:11px;margin:5px 0 8px;border-radius:8px;border:1px solid var(--line);background:#0c0d12;color:#fff;font-size:14px}
label{font-size:12px;color:#9aa3b5}.row{display:flex;gap:8px}.row>*{flex:1}
.tabs{display:flex;gap:8px;margin:8px 0;overflow-x:auto}.tabs button{border:1px solid var(--line);background:var(--card);color:#ddd;padding:7px 16px;border-radius:20px;white-space:nowrap;cursor:pointer}.tabs button.on{background:var(--b);border-color:var(--b)}
nav{position:fixed;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom);height:calc(64px + env(safe-area-inset-bottom));background:rgba(6,6,9,.97);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:20}
nav a{color:#9aa3b5;font-size:11px;text-align:center;cursor:pointer;padding:6px 8px}nav a.on{color:var(--b)}nav em{display:block;font-style:normal;font-size:21px}
.side{position:fixed;top:0;left:-270px;width:250px;height:100%;background:#090a0e;border-right:1px solid var(--line);z-index:40;padding:70px 12px;transition:.3s}.side.open{left:0}
.side a{display:block;padding:13px;border-radius:10px;color:#ddd;cursor:pointer}.side a:hover{background:rgba(150,165,200,.2)}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;z-index:50;padding:16px}.dlg>div{background:#0c0d12;border:1px solid var(--b);border-radius:14px;padding:16px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
.pick{border:2px solid var(--line);border-radius:10px;height:64px;display:flex;align-items:flex-end;font-size:10px;cursor:pointer;background-size:cover;background-position:center;background-color:#1a1c24;overflow:hidden}.pick span{background:rgba(0,0,0,.65);width:100%;text-align:center;padding:2px}.pick.on{border-color:#dbe3f2;box-shadow:0 0 10px var(--b)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#101219;border:1px solid var(--b);padding:10px 16px;border-radius:10px;z-index:60;font-size:13px}
.center{text-align:center;padding:50px 20px}.warn{color:#ff8a8a;font-size:12px}.hide{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 4px;border-bottom:1px solid #1d202a;text-align:left}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}.ov.open{opacity:1;pointer-events:auto}.side{transition:left .3s ease;box-shadow:none}.side.open{box-shadow:6px 0 30px rgba(0,0,0,.8)}
.chat{display:flex;flex-direction:column;height:calc(100dvh - 190px);min-height:360px;background:#090a0e;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chead{display:flex;gap:10px;align-items:center;padding:10px 12px;background:#171921;border-bottom:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:50%;background:var(--b);display:grid;place-items:center;flex:none}
.cmsgs{flex:1;overflow-y:auto;padding:10px;background:#050507}
.mrow{display:flex;margin:3px 0}.mrow.me{justify-content:flex-end}
.bub{max-width:80%;padding:6px 9px 4px;border-radius:10px 10px 10px 2px;background:#1d202a;font-size:14px;word-break:break-word}
.bub.me{background:#1e5bd8;border-radius:10px 10px 2px 10px}
.who{font-size:11px;font-weight:700;color:#9aa3b5;margin-bottom:2px;cursor:pointer}.who .own{background:var(--b);color:#fff;border-radius:4px;padding:0 4px}
.tm{font-size:10px;color:#b8c4dc;text-align:right;margin-top:2px}
.dsep{text-align:center;margin:8px 0}.dsep span{font-size:11px;background:#171921;color:#9aa3b5;padding:3px 10px;border-radius:10px}
.tags{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:#090a0e}.tags button{border:1px solid var(--line);background:var(--card);color:#ddd;border-radius:14px;padding:3px 10px;white-space:nowrap;font-size:12px}
.cbar{display:flex;gap:8px;padding:8px;background:#171921}.cbar input{margin:0;border-radius:20px}.send{width:44px;border-radius:50%;border:0;background:var(--b);color:#fff;font-size:18px;flex:none}
.bdg{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}

/* login */
.lg{min-height:100vh;position:relative;display:flex;justify-content:center;align-items:center;padding:28px 20px calc(28px + env(safe-area-inset-bottom));overflow:hidden}
.lgo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,7,.58) 0%,rgba(5,5,7,.78) 45%,rgba(5,5,7,.96) 100%),radial-gradient(420px 260px at 50% 22%,rgba(170,185,215,.22),transparent 70%)}
.lgc{position:relative;width:100%;max-width:380px;text-align:center;animation:lgin .6s ease both}
@keyframes lgin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lglogo{width:104px;height:104px;border-radius:24px;margin:0 auto 14px;box-shadow:0 0 0 1px rgba(120,130,155,.25),0 18px 44px rgba(0,0,0,.7)}
.lgname{font-size:34px;font-weight:800;font-style:italic;letter-spacing:5px;line-height:1.1;background:linear-gradient(180deg,#fff,#a9b3c7);-webkit-background-clip:text;background-clip:text;color:transparent}
.lgtag{font-size:11px;letter-spacing:3px;color:#9db8f5;font-weight:700;margin-top:6px}
.lgsub{color:#c4cbda;font-size:15px;margin:14px auto 20px;max-width:310px;line-height:1.45}
.lgfeat{display:grid;gap:8px;margin-bottom:22px;text-align:left}
.lgfeat div{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;background:rgba(20,22,30,.62);border:1px solid rgba(160,172,198,.22);border-radius:14px;padding:10px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lgfeat i{grid-row:1/3;width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#1c2030,#2d3348);display:grid;place-items:center;font-style:normal;font-size:19px}
.lgfeat b{font-size:14px;color:#f1f4fb}.lgfeat span{font-size:12px;color:#9aa3b5}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:#1f2430;border:0;border-radius:14px;padding:15px 18px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.45);touch-action:manipulation;transition:transform .12s}
.gbtn:active{transform:scale(.97)}.gbtn svg{width:22px;height:22px;flex:none}
.lgsec{display:flex;align-items:center;justify-content:center;gap:6px;color:#9aa3b5;font-size:12px;margin-top:12px}
.lgterms{color:#8b94a7;font-size:12px;line-height:1.5;margin-top:16px}.lgterms a{color:#b9c8ee;text-decoration:underline;cursor:pointer}
.lgget{display:inline-block;margin-top:14px;color:#9db8f5;font-size:13px;font-weight:600;text-decoration:none}

/* polish */
.btn{box-shadow:0 6px 18px rgba(31,86,200,.30)}.btn.alt,.btn.ok{box-shadow:none}
.mode{transition:border-color .15s,box-shadow .15s}.mode:hover,.mode:active{border-color:var(--b);box-shadow:0 0 14px rgba(61,120,242,.35)}.mode .img{height:76px}
nav a.on{color:#fff}nav a.on em{filter:drop-shadow(0 0 8px var(--b))}
.card.m:hover{border-color:#4a5578}
/* invite, daily, gift cards */
.hero{position:relative;overflow:hidden;border:1px solid #5b86e8;border-radius:16px;padding:16px;background:radial-gradient(260px 160px at 92% 0,rgba(90,140,255,.38),transparent 70%),linear-gradient(150deg,#16224a,#0a0c14 70%);box-shadow:0 0 24px rgba(61,120,242,.22);margin-bottom:10px}
.hero h3{font-size:20px;font-style:italic;line-height:1.25}
.code{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0;border:1.5px dashed #9db8f5;border-radius:12px;padding:10px 12px;background:rgba(5,5,7,.55)}
.code b{font-size:24px;letter-spacing:4px;background:var(--silver);-webkit-background-clip:text;background-clip:text;color:transparent}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.steps div{text-align:center;font-size:11px;color:#c4cbda;background:rgba(20,22,30,.7);border:1px solid var(--line);border-radius:12px;padding:10px 4px}.steps i{display:block;font-style:normal;font-size:22px;margin-bottom:4px}
.rank{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}.rank.done{border-color:var(--ok)}
.rank em{font-style:normal;font-size:20px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#1c2030;flex:none}.rank.done em{background:rgba(46,204,113,.2)}.rank div{flex:1}.rank b.r{color:var(--ok)}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.dd{text-align:center;border:1px solid var(--line);border-radius:10px;padding:7px 0;font-size:10px;color:#9aa3b5;background:var(--card)}.dd b{display:block;font-size:13px;color:#fff;margin-top:2px}
.dd.done{border-color:var(--ok);background:rgba(46,204,113,.12)}.dd.today{border-color:#9db8f5;box-shadow:0 0 12px rgba(61,120,242,.5);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 4px rgba(61,120,242,.2)}}
.gc{position:relative;overflow:hidden;border-radius:18px;padding:18px;min-height:158px;color:#fff;background:linear-gradient(135deg,#0f1c46,#2358c9 55%,#8fb0f5);box-shadow:0 14px 34px rgba(30,80,200,.35);border:1px solid rgba(255,255,255,.35);margin-bottom:10px}
.gc::after{content:"";position:absolute;top:-40%;right:-20%;width:70%;height:200%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:rotate(12deg);pointer-events:none}
.gct{font-size:11px;letter-spacing:3px;font-weight:700;opacity:.85}.gca{font-size:38px;font-weight:800;font-style:italic;margin:6px 0 2px;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.gcn{font-size:13px;opacity:.92;min-height:18px;word-break:break-word}.gcf{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:12px;font-size:11px}.gcf b{letter-spacing:2px;font-size:13px}
.promo{display:flex;align-items:center;gap:12px;cursor:pointer}.promo .pi{font-size:34px}

/* ice glass: black base, frosted blue and silver glass, one glow on the hero pieces */
:root{--line:rgba(190,205,235,.16);--glass:linear-gradient(155deg,rgba(255,255,255,.085),rgba(255,255,255,.02));--edge:inset 0 1px 0 rgba(255,255,255,.24),inset 0 0 0 1px rgba(255,255,255,.03)}
body::before{background:radial-gradient(420px 360px at 88% -4%,rgba(95,150,255,.34),transparent 70%),radial-gradient(380px 380px at -8% 62%,rgba(150,170,215,.20),transparent 70%),radial-gradient(300px 300px at 70% 108%,rgba(61,120,242,.16),transparent 70%)}
header{background:rgba(8,9,14,.55);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border-bottom:1px solid var(--line)}

.card,.mode,.tile,.rank,.dd,.ic,.tabs button,.steps div{background:var(--glass);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-color:var(--line);box-shadow:var(--edge),0 8px 24px rgba(0,0,0,.28)}
.card{border-radius:16px}.mode{border-radius:16px}
.tabs button.on{background:linear-gradient(180deg,rgba(120,170,255,.85),rgba(40,95,225,.85));border-color:rgba(200,220,255,.6);color:#fff}
.btn{background:linear-gradient(180deg,rgba(125,172,255,.95),rgba(38,92,224,.92));border:1px solid rgba(210,225,255,.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px rgba(40,95,225,.38);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.btn.alt{background:var(--glass);border-color:rgba(200,212,238,.28);box-shadow:var(--edge);text-shadow:none}
.btn.ok{background:linear-gradient(180deg,#58e08f,#22a85c);color:#04150b}
input,select,textarea{background:rgba(255,255,255,.05);border-color:rgba(190,205,235,.2);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}input:focus,select:focus,textarea:focus{outline:none;border-color:#8fb3ff;box-shadow:0 0 0 3px rgba(95,150,255,.25)}
.dlg>div{background:rgba(14,16,24,.78);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(200,215,245,.28);box-shadow:var(--edge),0 24px 60px rgba(0,0,0,.6)}
.side{background:rgba(10,11,17,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}

.code{background:rgba(255,255,255,.06);border:1.5px dashed rgba(210,225,255,.6);backdrop-filter:blur(8px)}

button.chip{color:#fff;font-size:13px}
.gct{letter-spacing:.5px;font-size:12px}
@media (prefers-reduced-motion:reduce){.dd.today{animation:none}*{transition:none!important}}

/* match cards, podium, level and badges */
.tag.live{animation:lp 1.6s infinite}@keyframes lp{0%{box-shadow:0 0 0 0 rgba(255,71,87,.6)}70%,100%{box-shadow:0 0 0 7px rgba(255,71,87,0)}}
.pod{display:flex;align-items:flex-end;gap:8px;margin-bottom:10px}.pd{flex:1;text-align:center;border:1px solid var(--line);border-radius:14px;padding:10px 4px;background:var(--glass);box-shadow:var(--edge);min-width:0}
.pd b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pd em{font-size:24px;font-style:normal;display:block}.pd small{color:#9aa3b5;font-size:11px}
.pd.p0{padding-top:24px;border-color:rgba(210,225,255,.55);box-shadow:var(--edge),0 0 24px rgba(120,170,255,.35)}.pd.p0 em{font-size:32px}

@media (prefers-reduced-motion:reduce){.tag.live{animation:none}}

/* delight: headings, button shine, confetti, wheel */
h2{display:flex;align-items:center;gap:8px}h2::before{content:"";flex:none;width:4px;height:18px;border-radius:2px;background:linear-gradient(#c9d6f2,#3d78f2)}
.btn{position:relative;overflow:hidden}.btn:not(.alt):not(:disabled)::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite;pointer-events:none}
